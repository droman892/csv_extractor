[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csv_extractor"
version = "0.2.0"
description = "Desktop app that validates support-ticket CSV files and reports what is wrong with them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Roman" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6>=6.11,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-qt>=4.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pyinstaller>=6.10",
]

# The package is found automatically in src/; this adds the sample CSV the
# upload screen offers, which is data, not code.
[tool.setuptools.package-data]
csv_extractor = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# mypy is configured in mypy.ini.
